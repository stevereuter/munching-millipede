name: Shared Web Package and Pages

on:
    workflow_call:
        inputs:
            ref:
                description: Git ref (branch, tag, or commit SHA) to build
                required: true
                type: string
            release_tag:
                description: Existing release tag to upload the web zip (optional)
                required: false
                type: string
                default: ""
            deploy_pages:
                description: Deploy built web output to GitHub Pages
                required: false
                type: boolean
                default: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    package-web:
        runs-on: ubuntu-latest

        steps:
            - name: Check out selected ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - name: Read version from config.json
              id: version
              shell: bash
              run: |
                  version="$(node -p "require('./config.json').version")"
                  if [ -z "$version" ]; then
                    echo "Error: version not found in config.json" >&2
                    exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Prepare web release files
              shell: bash
              run: |
                  rm -rf dist-web
                  cp -R web dist-web

                  sed -i "s/###VERSION###/${{ steps.version.outputs.version }}/g" dist-web/index.html
                  sed -i "s/###VERSION###/${{ steps.version.outputs.version }}/g" dist-web/scripts/index.mjs

            - name: Build web zip name
              id: zip
              shell: bash
              run: |
                  repo_name="${GITHUB_REPOSITORY#*/}"
                  zip_name="${repo_name}-web-v${{ steps.version.outputs.version }}.zip"
                  echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

            - name: Create web zip
              shell: bash
              run: |
                  cd dist-web
                  zip -r "../${{ steps.zip.outputs.zip_name }}" .

            - name: Upload web zip to release assets
              if: ${{ inputs.release_tag != '' }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.release_tag }}
                  files: ${{ steps.zip.outputs.zip_name }}
                  fail_on_unmatched_files: true

            - name: Upload Pages artifact
              if: ${{ inputs.deploy_pages }}
              uses: actions/upload-pages-artifact@v4
              with:
                  path: dist-web

    deploy-pages:
        if: ${{ inputs.deploy_pages }}
        needs: package-web
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
              with:
                  artifact_name: github-pages
                  timeout: 1200000
                  error_count: 10
                  reporting_interval: 5000
