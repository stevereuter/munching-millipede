name: Manual Web Package and Pages

on:
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: manual-web-${{ github.run_id }}
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    run-shared-manual-web:
        uses: ./.github/workflows/release-web-reusable.yml
        secrets: inherit
