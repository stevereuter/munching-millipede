name: Release Web Package and Pages

on:
    release:
        types: [published]

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: release-web-${{ github.event.release.id }}
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    run-shared-release-web:
        uses: ./.github/workflows/release-web-reusable.yml
        with:
            release_tag: ${{ github.event.release.tag_name }}
        secrets: inherit
